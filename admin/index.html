<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sveltia CMS</title>
    <style>
      html, body {
        margin: 0;
        min-height: 100%;
        background: #f4f4f5;
        font-family: Inter, system-ui, sans-serif;
      }
      body {
        display: grid;
        place-items: center;
      }
      .loader {
        padding: 2rem 3rem;
        border-radius: 18px;
        background: white;
        border: 1px solid #e2e2e6;
        box-shadow: 0 20px 40px rgba(17, 17, 19, 0.08);
      }
    </style>
  </head>
  <body>
    <div class="loader">Loading Sveltia CMS…</div>
    <!--
      Sveltia CMS reads ./config.yml next to this file automatically.
      Keep ALL configuration in config.yml — an inline `SveltiaCMS.init({ config })`
      call here would fully override it and silently hide collections and fields.
    -->
    <script src="https://unpkg.com/@sveltia/cms@latest/dist/sveltia-cms.js"></script>
  </body>
</html>
